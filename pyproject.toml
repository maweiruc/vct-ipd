[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vct-ipd"
version = "0.1.0"
description = "Evidence-calibrated synthetic IPD: offline deterministic demonstration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2"]
openai = ["openai>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
